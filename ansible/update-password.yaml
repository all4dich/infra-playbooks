---
- name: Update User Information
  vars_prompt:
    - name: target_host
      prompt: "Set target host"
      private: no
      default: "all"
    - name: username
      prompt: "Set username"
      private: no
    - name: newpassword
      prompt: "Set user's newpassword"
      private: no
      default: "ChangeYourPassword1@"
  hosts: "{{ target_host }}"
  become: yes
  tasks:
    - name: Update User Password
      ansible.builtin.user:
        name: "{{ username }}"
        password: "{{ newpassword | password_hash('sha512') }}"